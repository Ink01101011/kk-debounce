name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

jobs:
  quality-and-security:
    name: Quality and Security Checks (${{ matrix.os }}, Node ${{ matrix.node_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node_version: [22, 24]

    steps:
      # Actions are pinned to full commit SHAs; the comment records the release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run quality and security gate
        run: pnpm run check:all

      # Release gate: production dependency vulnerabilities block publishing.
      - name: Release gate CVE check (production dependencies)
        run: pnpm run check:cve -- --prod

      # Tracking only: dev tooling vulnerabilities are surfaced for maintenance follow-up.
      - name: Tracking CVE check (dev tools dependencies)
        run: pnpm run check:cve:full

  react-compatibility:
    name: React Compatibility (React ${{ matrix.react_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react_version: 18
            react_types_version: 18
          - react_version: 19
            react_types_version: 19

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Switch React version for compatibility validation
        run: pnpm add -D react@^${{ matrix.react_version }} @types/react@^${{ matrix.react_types_version }}

      - name: Run React compatibility checks
        run: pnpm run typecheck && pnpm run test
